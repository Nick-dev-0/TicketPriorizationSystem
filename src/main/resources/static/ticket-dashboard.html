<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Dashboard</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous"></head>
<body>

<main class="container mt-4">
    <form id="create-ticket-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input
                    class="form-control"
                    type="text"
                    id="title"
                    name="title"
                    required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea
                    class="form-control"
                    id="description"
                    name="description"
                    rows="3"
                    required></textarea>
        </div>

        <div class="form-group">
            <label for="severity">Severity</label>
            <select
                    class="form-control"
                    id="severity"
                    name="severity"
                    required>
                <option value="SEV1" class="severity-sev1">SEV1</option>
                <option value="SEV2" class="severity-sev2">SEV2</option>
                <option value="SEV3" class="severity-sev3">SEV3</option>
                <option value="SEV4" class="severity-sev4">SEV4</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Create Ticket
        </button>
    </form>

    <h2 class="mt-4">Open Tickets</h2>
<!--TODO add tickets count-->
    <table class="table">
        <thead>
        <tr>
            <th scope="col">Title</th>
            <th scope="col">Description</th>
            <th scope="col">Severity</th>
            <th scope="col">Created Date</th>
            <th scope="col">ID</th>
            <th scope="col">Edit</th>
        </tr>
        </thead>
        <tbody id="ticket-table-body">
        </tbody>
    </table>

    <div class="modal" id="myModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h4 class="modal-title">Edit Ticket</h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>

                <form id="edit-ticket-form">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="title-modal">Title</label>
                            <input
                                    class="form-control"
                                    type="text"
                                    id="title-modal"
                                    name="title-modal"
                                    required>
                        </div>

                        <div class="form-group">
                            <label for="description-modal">Description</label>
                            <textarea
                                    class="form-control"
                                    id="description-modal"
                                    name="description-modal"
                                    rows="3"
                                    required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="severity-modal">Severity</label>
                            <select
                                    class="form-control"
                                    id="severity-modal"
                                    name="severity-modal"
                                    required>
                                <option value="SEV1" class="severity-sev1">SEV1</option>
                                <option value="SEV2" class="severity-sev2">SEV2</option>
                                <option value="SEV3" class="severity-sev3">SEV3</option>
                                <option value="SEV4" class="severity-sev4">SEV4</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button
                                type="button"
                                class="btn btn-secondary"
                                data-dismiss="modal">Cancel</button>
                        <button
                                type="submit"
                                class="btn btn-primary" >Save Changes</button>
                    </div>
                </form>

            </div>
        </div>

    </div>
</main>

<script>
    let editingTicketId = null;

    async function buildTable() {
        const ticketAPI = "/api/tickets";
        const response = await fetch(ticketAPI);
        const data = await response.json();

        const tBody = document.getElementById("ticket-table-body");

        tBody.innerHTML = "";

        const severityClasses = {
            "SEV1": "severity-sev1",
            "SEV2": "severity-sev2",
            "SEV3": "severity-sev3",
            "SEV4": "severity-sev4"
        }
        for (const ticket of data) {
            const tRow = document.createElement("tr");

            const tHeader = document.createElement("th");
            tHeader.scope = "row";
            tHeader.textContent = ticket.title;
            tRow.appendChild(tHeader);

            const tDescription = document.createElement("td");
            tDescription.textContent = ticket.description;
            tRow.appendChild(tDescription);

            const tSeverity = document.createElement("td");
            const span = document.createElement("span");
            span.textContent = ticket.severity;

            span.classList.add("badge");
            span.classList.add("badge-pill");

            const severityStyle = severityClasses[ticket.severity];
            span.classList.add(severityStyle);

            tSeverity.appendChild(span);
            tRow.appendChild(tSeverity);

            const createdDate = new Date(ticket["timestamp"]);
            const formattedDate = createdDate.toLocaleString("en-US", {
                month: "numeric",
                day: "numeric",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                hourCycle: "h23",
                timeZoneName: "short"
            });
            const tcreatedDate = document.createElement("td");
            tcreatedDate.textContent = formattedDate;
            tRow.appendChild(tcreatedDate);

            const tID = document.createElement("td");
            tID.textContent = ticket.id;
            tRow.appendChild(tID);

            const edit = document.createElement("button");
            edit.type = "button";
            edit.className = ("btn btn-primary");
            edit.id = `edit-btn-${ticket.id}`;
            edit.textContent = "Edit";
            tRow.appendChild(edit);

            edit.addEventListener("click", () => {
                $("#myModal").modal("show");

                const titleModal = document.getElementById("title-modal")
                const descriptionModal = document.getElementById("description-modal")
                const severityModal = document.getElementById("severity-modal")

                titleModal.value = ticket["title"];
                descriptionModal.value = ticket["description"];
                severityModal.value = ticket["severity"];

                editingTicketId = ticket.id;
            });

            tBody.appendChild(tRow);
        }
    }

    buildTable();

    const form = document.getElementById("create-ticket-form");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;
        const severity = document.getElementById("severity").value;

        const ticketData = {
            "title": title,
            "description": description,
            "severity": severity
        }

        const response = await fetch("/api/tickets", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(ticketData)
        })
        console.log(response.status);

        if (response.status === 201) {
            await buildTable();
        }
    });

    const editForm = document.getElementById("edit-ticket-form");
    editForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const titleModal = document.getElementById("title-modal").value;
        const descriptionModal = document.getElementById("description-modal").value;
        const severityModal = document.getElementById("severity-modal").value;

        const ticketData = {
            "title": titleModal,
            "description": descriptionModal,
            "severity": severityModal
        }

        const response = await fetch(`/api/tickets/${editingTicketId}`, {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(ticketData)
        })
        console.log(response.status);

        if (response.status === 200) {
            $("#myModal").modal("hide");
            await buildTable();
        }
    });

</script>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>

</body>
</html>
