<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Dashboard</title>

    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous"></head>
<body>

<main class="container mt-4">
    <form id="create-ticket-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input
                    class="form-control"
                    type="text"
                    id="title"
                    name="title"
                    required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea
                    class="form-control"
                    id="description"
                    name="description"
                    rows="3"
                    required></textarea>
        </div>

        <div class="form-group">
            <label for="severity">Severity</label>
            <select
                    class="form-control"
                    id="severity"
                    name="severity"
                    required>
                <option value="SEV1" class="severity-sev1">SEV1</option>
                <option value="SEV2" class="severity-sev2">SEV2</option>
                <option value="SEV3" class="severity-sev3">SEV3</option>
                <option value="SEV4" class="severity-sev4">SEV4</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Create Ticket
        </button>
    </form>

    <h2 class="mt-4">
        <span id="ticketHeadingText">Open Tickets</span>
    </h2>

    <div class="card mb-3">
        <div class="card-body p-0">
            <div class="row no-gutters">

                <div class="col-6 text-center border-right py-3">
                    <div class="form-check d-inline-block">
                        <input
                                type="checkbox"
                                class="form-check-input"
                                id="openTicketFilter"
                                checked>
                        <label
                                class="form-check-label"
                                for="openTicketFilter">
                            Open
                        </label>
                    </div>

                    <div class="mt-1">
                        <small class="text-muted">
                            <span id="openTicketCount">0</span> tickets
                        </small>
                    </div>
                </div>

                <div class="col-6 text-center py-3">
                    <div class="form-check d-inline-block">
                        <input
                                type="checkbox"
                                class="form-check-input"
                                id="resolvedTicketFilter">
                        <label
                                class="form-check-label"
                                for="resolvedTicketFilter">
                            Resolved
                        </label>
                    </div>

                    <div class="mt-1">
                        <small class="text-muted">
                            <span id="resolvedTicketCount">0</span> tickets
                        </small>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <table class="table">
        <thead>
        <tr>
            <th scope="col">Title</th>
            <th scope="col">Description</th>
            <th scope="col">Severity</th>
            <th scope="col">Created Date</th>
            <th scope="col">Status</th>
            <th scope="col">Edit</th>
        </tr>
        </thead>
        <tbody id="ticket-table-body">
        </tbody>
    </table>

    <div class="modal" id="myModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h4 class="modal-title">Edit Ticket</h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>

                <form id="edit-ticket-form">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="title-modal">Title</label>
                            <input
                                    class="form-control"
                                    type="text"
                                    id="title-modal"
                                    name="title-modal"
                                    required>
                        </div>

                        <div class="form-group">
                            <label for="description-modal">Description</label>
                            <textarea
                                    class="form-control"
                                    id="description-modal"
                                    name="description-modal"
                                    rows="3"
                                    required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="severity-modal">Severity</label>
                            <select
                                    class="form-control"
                                    id="severity-modal"
                                    name="severity-modal"
                                    required>
                                <option value="SEV1" class="severity-sev1">SEV1</option>
                                <option value="SEV2" class="severity-sev2">SEV2</option>
                                <option value="SEV3" class="severity-sev3">SEV3</option>
                                <option value="SEV4" class="severity-sev4">SEV4</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="status-modal">Status</label>
                            <select
                                    class="form-control"
                                    id="status-modal"
                                    name="status-modal"
                                    required>
                                <option value="OPEN" class="status-open">OPEN</option>
                                <option value="RESOLVED" class="status-resolved">RESOLVED</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button
                                type="button"
                                class="btn btn-secondary"
                                data-dismiss="modal">Cancel</button>
                        <button
                                type="submit"
                                class="btn btn-primary" >Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="/ticket-dashboard.js?v=20261029-1" defer></script>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>

</body>
</html>
