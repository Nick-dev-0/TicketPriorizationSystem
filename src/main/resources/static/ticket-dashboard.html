<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous"></head>
<body>

<main class="container mt-4">
    <form id="create-ticket-form">
        <div class="form-group">
            <label for="title">Title</label>
            <input
                    class="form-control"
                    type="text"
                    id="title"
                    name="title"
                    required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea
                    class="form-control"
                    id="description"
                    name="description"
                    rows="3"
                    required></textarea>
        </div>

        <div class="form-group">
            <label for="severity">Severity</label>
            <select
                    class="form-control"
                    id="severity"
                    name="severity"
                    required>
                <option value="SEV1">SEV1</option>
                <option value="SEV2">SEV2</option>
                <option value="SEV3">SEV3</option>
                <option value="SEV4">SEV4</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Create Ticket
        </button>
    </form>

    <h2 class="mt-4">Open Tickets</h2>
<!--TODO add tickets count-->
    <table class="table">
        <thead>
        <tr>
            <th scope="col">Title</th>
            <th scope="col">Description</th>
            <th scope="col">Severity</th>
            <th scope="col">ID</th>
        </tr>
        </thead>
        <tbody id="ticket-table-body">
        </tbody>
    </table>
</main>

<script>
    async function buildTable() {
        const ticketAPI = "/api/tickets";
        const response = await fetch(ticketAPI);
        const data = await response.json();

        const tBody = document.getElementById("ticket-table-body");

        tBody.innerHTML = "";

        for (const ticket of data) {
            const tRow = document.createElement("tr");

            const tHeader = document.createElement("th");
            tHeader.scope = "row";
            tHeader.textContent = ticket.title;
            tRow.appendChild(tHeader);

            const tDescription = document.createElement("td");
            tDescription.textContent = ticket.description;
            tRow.appendChild(tDescription);

            const tSeverity = document.createElement("td");
            tSeverity.textContent = ticket.severity;
            tRow.appendChild(tSeverity);

            const tID = document.createElement("td");
            tID.textContent = ticket.id;
            tRow.appendChild(tID);

            tBody.appendChild(tRow);
        }
    }

    buildTable();

    const form = document.getElementById("create-ticket-form");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const title = document.getElementById("title").value;
        const description = document.getElementById("description").value;
        const severity = document.getElementById("severity").value;

        const ticketData = {
            "title": title,
            "description": description,
            "severity": severity
        }

        const response = await fetch("/api/tickets", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(ticketData)
        })
        console.log(response.status);

        if (response.status === 201) {
            await buildTable();
        }
    });
</script>
</body>
</html>
