spring.config.import=optional:file:./.env[.properties]
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:ticket_system}
server.port=${PORT:8080}
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
app.demo-mode=${APP_DEMO_MODE:false}

openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-6-luna}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

management.endpoints.web.cors.allowed-origins=https://ticket-prioritization-frontend.onrender.com
management.endpoints.web.cors.allowed-methods=GET